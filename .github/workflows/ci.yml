name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The bayes* repos are private; the default GITHUB_TOKEN is scoped to
      # this repo only. BAYES_REPOS_TOKEN is a fine-grained PAT with
      # contents:read on the same-owner dependencies (bayeswire, jaxstanv5).
      - name: Grant git read access to pinned same-owner dependencies
        env:
          BAYES_REPOS_TOKEN: ${{ secrets.BAYES_REPOS_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${BAYES_REPOS_TOKEN}@github.com/StefanSko/".insteadOf "https://github.com/StefanSko/"
      - name: Checkout bayesite
        uses: actions/checkout@v4
        with:
          repository: StefanSko/bayesite
          token: ${{ secrets.BAYES_REPOS_TOKEN || github.token }}
          path: .bayesite-src
      - name: Build bayesite release binary
        run: cargo build --release --manifest-path .bayesite-src/Cargo.toml
      - name: Preflight the pinned dependencies
        run: |
          for repo in bayeswire jaxstanv5; do
            if ! git ls-remote "https://github.com/StefanSko/${repo}.git" HEAD >/dev/null 2>&1; then
              echo "::error::Cannot read StefanSko/${repo}. The bayes* repos are private: add a fine-grained PAT with contents:read on them as the BAYES_REPOS_TOKEN Actions secret of this repo."
              exit 1
            fi
          done
      - name: Sync (bayeswire + jaxstanv5 inproc extra)
        run: uv sync --extra inproc
      - name: Format
        run: uv run ruff format --check --exclude .bayesite-src .
      - name: Lint
        run: uv run ruff check --exclude .bayesite-src .
      - name: Types
        run: uv run ty check
      - name: Tests
        run: |
          export BAYESCYCLE_TEST_BAYESITE_BIN="$PWD/.bayesite-src/target/release/bayesite"
          uv run pytest -q

  # The default agent path executes model.py with bayeswire only — no JAX,
  # ever. This job proves it end-to-end with a real bayesite binary.
  no-jax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Grant git read access to pinned same-owner dependencies
        env:
          BAYES_REPOS_TOKEN: ${{ secrets.BAYES_REPOS_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${BAYES_REPOS_TOKEN}@github.com/StefanSko/".insteadOf "https://github.com/StefanSko/"
      - name: Checkout bayesite
        uses: actions/checkout@v4
        with:
          repository: StefanSko/bayesite
          token: ${{ secrets.BAYES_REPOS_TOKEN || github.token }}
          path: .bayesite-src
      - name: Build bayesite release binary
        run: cargo build --release --manifest-path .bayesite-src/Cargo.toml
      - name: Sync without the inproc extra (no JAX installed)
        run: uv sync
      - name: Assert JAX is absent
        run: |
          uv run python -c "
          import importlib.util
          assert importlib.util.find_spec('jax') is None, 'JAX leaked onto the default path'
          assert importlib.util.find_spec('jaxstanv5') is None, 'jaxstanv5 leaked onto the default path'
          import bayeswire
          "
      - name: Bayesite-backend test subset
        run: |
          export BAYESCYCLE_TEST_BAYESITE_BIN="$PWD/.bayesite-src/target/release/bayesite"
          uv run pytest -q
