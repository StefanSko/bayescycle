name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync (bayeswire + jaxstanv5 inproc extra)
        run: uv sync --extra inproc
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run ty check src tests
      - name: Fetch pinned bayesite engine
        run: |
          echo "BAYESCYCLE_TEST_BAYESITE_BIN=$(uv run scripts/fetch_engine_release.py --out .bayesite-bin)" >> "$GITHUB_ENV"
          # Unknown commands answer with a JSON usage error (exit 1); anything
          # above that (bad exec format, segfault, ...) means the binary does
          # not actually run on this runner.
          "$(uv run scripts/fetch_engine_release.py --out .bayesite-bin)" capabilities || status=$?
          if [ "${status:-0}" -gt 1 ]; then
            echo "::error::pinned bayesite engine did not launch on this runner (exit ${status})"
            exit 1
          fi
      - name: Tests
        run: uv run pytest -q

  # The default agent path executes model.py with bayeswire only — no JAX,
  # ever. This job proves it end-to-end with a real bayesite binary.
  no-jax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync without the inproc extra (no JAX installed)
        run: uv sync
      - name: Assert JAX is absent
        run: |
          uv run python -c "
          import importlib.util
          assert importlib.util.find_spec('jax') is None, 'JAX leaked onto the default path'
          assert importlib.util.find_spec('jaxstanv5') is None, 'jaxstanv5 leaked onto the default path'
          import bayeswire
          "
      - name: Fetch pinned bayesite engine
        run: |
          echo "BAYESCYCLE_TEST_BAYESITE_BIN=$(uv run scripts/fetch_engine_release.py --out .bayesite-bin)" >> "$GITHUB_ENV"
          "$(uv run scripts/fetch_engine_release.py --out .bayesite-bin)" capabilities || status=$?
          if [ "${status:-0}" -gt 1 ]; then
            echo "::error::pinned bayesite engine did not launch on this runner (exit ${status})"
            exit 1
          fi
      - name: Bayesite-backend test subset
        run: uv run pytest -q
