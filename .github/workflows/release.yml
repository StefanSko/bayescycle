# Lockstep release: publishing all six distributions (bayeswire,
# bayesjax, bayescycle, bayescycle-study, bayesite-viz, bayesite-idata) to PyPI on a tag
# (monorepo migration step 3, see docs/monorepo-migration.md).
#
# PyPI's PENDING trusted publishers are unique on the (owner, repository,
# workflow, environment) tuple -- one repo cannot pre-register six
# not-yet-existing project names against the same environment. Each
# package therefore publishes from its own job with its own environment
# (pypi-<name>), and the six pending publishers are registered as:
# owner StefanSko, repo bayescycle, workflow release.yml, environment
# pypi-bayeswire / pypi-bayesjax / pypi-bayescycle / pypi-bayescycle-study /
# pypi-bayesite-viz / pypi-bayesite-idata, one per matching distribution name. GitHub creates
# the environments automatically on first use. After the first publish,
# each pending publisher converts to a normal per-project trusted
# publisher bound to the same environment name.
#
# `uv publish --check-url` makes re-runs idempotent: artifacts already on
# PyPI are skipped instead of failing the job.

on:
  push:
    tags:
      - "v*"

jobs:
  # Confirms the tag names the lockstep version every pyproject.toml
  # actually carries, then runs the root guard tests (tests/) that assert
  # all six versions and sibling pins agree -- a tag on a tree where they
  # don't agree must never reach the publish jobs.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Assert tag matches the lockstep version
        run: |
          version="$(grep -m1 '^version = ' packages/bayeswire/pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
          expected="v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match lockstep version ${expected} (read from packages/bayeswire/pyproject.toml)"
            exit 1
          fi
      - name: Sync (root dev group only)
        run: uv sync --only-dev
      - name: Root guard tests
        run: uv run --no-sync pytest tests -q

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bayeswire
            build: uv build --package bayeswire --out-dir dist
          - name: bayesjax
            build: uv build --package bayesjax --out-dir dist
          - name: bayescycle
            build: uv build --package bayescycle --out-dir dist
          - name: bayescycle-study
            build: uv build --package bayescycle-study --out-dir dist
          - name: bayesite-viz
            build: uv build packages/bayesite-viz --out-dir dist
          - name: bayesite-idata
            build: uv build packages/bayesite-idata --out-dir dist
    environment: pypi-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build ${{ matrix.name }}
        run: ${{ matrix.build }}
      - name: Check distribution
        run: uvx twine check dist/*
      - name: Publish ${{ matrix.name }} to PyPI (trusted publishing, no token secrets)
        run: uv publish --check-url https://pypi.org/simple/ dist/*
