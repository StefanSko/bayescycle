# Lockstep release: publishing all five distributions (bayeswire,
# bayesjax, bayescycle, bayesite-viz, bayesite-idata) to PyPI on a tag
# (monorepo migration step 3, see docs/monorepo-migration.md).
#
# Publishing requires the five pending trusted publishers to be registered
# on pypi.org before the first tag: owner StefanSko, repo bayescycle,
# workflow release.yml, environment pypi -- one trusted publisher per
# distribution name (bayeswire, bayesjax, bayescycle, bayesite-viz,
# bayesite-idata). Without that registration, `uv publish`'s OIDC exchange
# is rejected by PyPI.

on:
  push:
    tags:
      - "v*"

jobs:
  # Confirms the tag names the lockstep version every pyproject.toml
  # actually carries, then runs the root guard tests (tests/) that assert
  # all five versions and sibling pins agree -- a tag on a tree where they
  # don't agree must never reach the publish job.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Assert tag matches the lockstep version
        run: |
          version="$(grep -m1 '^version = ' packages/bayeswire/pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
          expected="v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match lockstep version ${expected} (read from packages/bayeswire/pyproject.toml)"
            exit 1
          fi
      - name: Sync (root dev group only)
        run: uv sync --only-dev
      - name: Root guard tests
        run: uv run --no-sync pytest tests -q

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build workspace distributions (bayeswire, bayesjax, bayescycle)
        run: |
          uv build --package bayeswire --out-dir dist
          uv build --package bayesjax --out-dir dist
          uv build --package bayescycle --out-dir dist
      - name: Build bayesite-viz and bayesite-idata (standalone uv projects)
        run: |
          uv build packages/bayesite-viz --out-dir dist
          uv build packages/bayesite-idata --out-dir dist
      - name: Check distributions
        run: uvx twine check dist/*
      - name: Publish to PyPI (trusted publishing, no token secrets)
        run: uv publish dist/*
