[project]
name = "bayescycle"
version = "0.1.0"
description = "Python workflow CLI for bayeswire model authoring and Bayesite engine runs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # The harness and the language move in lockstep: exact-commit pin, bumped
    # deliberately (the pin-bump diff is the compatibility review).
    "bayeswire @ git+https://github.com/StefanSko/bayeswire.git@v0.1.0",
]

[project.optional-dependencies]
inproc = [
    "jaxstanv5 @ git+https://github.com/StefanSko/jaxstanv5.git@e89bdd5e60e87acf6da9dc2c64c4ea451319f8f5",
]

[project.scripts]
bayescycle = "bayescycle._cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.13.0",
    "ty==0.0.49",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python = "./.venv"
python-version = "3.12"
root = ["./src", "./tests"]
