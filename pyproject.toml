[tool.uv.workspace]
members = [
    "packages/bayeswire",
    "packages/jaxstanv5",
    "packages/bayescycle",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.13.0",
    "ty==0.0.49",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.src]
include = ["tests", "scripts"]

[tool.ty.environment]
python = "./.venv"
python-version = "3.12"
root = ["./tests", "./scripts"]
