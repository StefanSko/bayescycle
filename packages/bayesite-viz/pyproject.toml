[project]
name = "bayesite-viz"
version = "0.7.0"
description = "Agent-operable CLI that renders ArviZ Bayesian plots from an InferenceData fit."
readme = "README.md"
authors = [{ name = "StefanSko" }]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "click",
    "arviz-base>=1.2.0",
    "arviz-plots>=1.2.0",
    "arviz-stats>=1.2.0",
    "matplotlib>=3.11.0",
    "netcdf4>=1.7.4",
    "numpy",
    "xarray>=2026.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.13.0",
    "ty==0.0.49",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["bayesite_viz"]

[project.scripts]
bayesite-viz = "bayesite_viz.cli:cli"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
python = "./.venv"
python-version = "3.13"
