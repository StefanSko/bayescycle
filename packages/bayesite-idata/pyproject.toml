[project]
name = "bayesite-idata"
version = "0.1.0"
description = "Bayescycle run-directory to ArviZ DataTree/NetCDF exporter."
readme = "README.md"
authors = [{ name = "StefanSko" }]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "click",
    "arviz-base>=1.2.0",
    "netcdf4>=1.7.4",
    "numpy",
    "xarray>=2026.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.13.0",
    "ty==0.0.49",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["bayesite_idata"]

[project.scripts]
bayesite-idata = "bayesite_idata.cli:cli"
