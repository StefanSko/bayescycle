[project]
name = "bayescycle"
version = "0.1.0"
description = "Python workflow CLI for bayeswire model authoring and Bayesite engine runs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # The harness and the language move in lockstep inside the uv workspace:
    # both packages resolve from the same repo at the same commit, so there
    # is no separate pin to bump.
    "bayeswire",
]

[project.optional-dependencies]
inproc = [
    "jaxstanv5",
]

[project.scripts]
bayescycle = "bayescycle._cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.13.0",
    "ty==0.0.49",
]

[tool.uv.sources]
bayeswire = { workspace = true }
jaxstanv5 = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python = "../../.venv"
python-version = "3.12"
root = ["./src", "./tests", "./scripts"]
